name: Issue 327

# Reproduction harness for https://github.com/PumasAI/QuartoNotebookRunner.jl/issues/327,
# a Windows render that never returns once a cell calls `OMJulia.OMCSession()`.
#
# The cause is the one #436 fixed for #329. omc outlives the cell that starts
# it, so it holds the write end of the pipe the cell's output is captured
# through, and a capture that waits for end of file waits for omc.
#
# Run 35074896921 ran the notebook on Windows against OMJulia v0.3.2, the
# release current when the issue was filed. v0.18.3 stopped at
# `Running [2/3] ... omc = OMJulia.OMCSession();` and was killed at the 900 s
# deadline, which is the issue's report line for line. The branch carrying #436
# rendered in 128 s. Linux rendered in 100 s, as the issue says it does.
#
# Run 35079033299 added the port-file probe and kept each render. The probe
# starts omc the way v0.3.2 does and reports the port file after 0.09-0.16 s
# with omc still running, so nothing here turns on omc being slow or dead. The
# branch renders all three cells and `getInstallationDirectoryPath()` returns
# `C:/Program Files/OpenModelica1.25.1-64bit`. v0.18.3 hangs.
#
# It hangs against OMJulia v0.4.0 too, which redirects omc's stdout and stderr
# to files in every branch. Redirecting the child's own streams does not stop it
# inheriting the capture pipe on Windows, so upgrading OMJulia is not a way
# around this and the runner change is what the notebook needs.
#
# Delete this workflow and `.github/issue327/` once the question is settled.

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  render:
    name: ${{ matrix.os }} / runner ${{ matrix.runner }} / OMJulia ${{ matrix.omjulia }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The combination the issue reports.
          - os: windows-latest
            runner: "0.18.3"
            omjulia: "0.3.2"
          # The same thing with #436 in the runner.
          - os: windows-latest
            runner: branch
            omjulia: "0.3.2"
          # OMJulia v0.4.0 redirects omc's output in every branch and hangs here
          # anyway. It is the newest release in the General registry: v1.0.0 is
          # tagged but not registered.
          - os: windows-latest
            runner: "0.18.3"
            omjulia: "0.4.0"
          # What a reader of the issue gets today.
          - os: windows-latest
            runner: branch
            omjulia: "0.4.0"
          # Linux rendered the notebook all along.
          - os: ubuntu-latest
            runner: "0.18.3"
            omjulia: "0.3.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: julia-actions/install-juliaup@1cc1b0ecfb06c04ff09fe24cab1476106460750e # v3.1.5
        with:
          channel: "lts"

      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: 1.10.18

      # Sets `OPENMODELICAHOME` on Windows, which is the branch of `OMCSession`
      # the issue goes through.
      - uses: OpenModelica/setup-openmodelica@419f31141aa79a22f7033def5626047dd3bb5069 # v1.2
        with:
          version: "1.25.1"

      - name: Report the versions under test
        run: |
          omc --version || true
          quarto --version
          julia --version

      # Whether omc announces its port inside the 2 s v0.3.2 allows, and whether
      # it stays alive when it does not. A cell that ends because omc died says
      # nothing about the capture.
      - name: Time omc's port file
        if: runner.os == 'Windows'
        continue-on-error: true
        run: julia .github/issue327/port-file-probe.jl

      - name: Install QuartoNotebookRunner ${{ matrix.runner }}
        env:
          RUNNER_SOURCE: ${{ matrix.runner }}
        run: |
          mkdir -p qnrenv
          julia --project=qnrenv <<'EOF'
          using Pkg
          if ENV["RUNNER_SOURCE"] == "branch"
              Pkg.develop(; path = pwd())
          else
              Pkg.add(; name = "QuartoNotebookRunner", version = ENV["RUNNER_SOURCE"])
          end
          Pkg.instantiate()
          Pkg.precompile()
          EOF

      - name: Render reported.qmd
        continue-on-error: true
        env:
          QUARTO_JULIA_PROJECT: ${{ github.workspace }}/qnrenv
          OMJULIA_VERSION: ${{ matrix.omjulia }}
        run: |
          bash .github/issue327/deadline.sh \
            "${{ matrix.os }} runner ${{ matrix.runner }} OMJulia ${{ matrix.omjulia }}" 900 \
            quarto render .github/issue327/reported.qmd --to html

      # A render that finishes still has to have run the cells. The html says
      # which of them produced output and what the errors were.
      - name: Keep the rendered notebook
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-${{ matrix.os }}-${{ matrix.runner }}-${{ matrix.omjulia }}
          path: |
            .github/issue327/reported.html
            .github/issue327/reported_files
          if-no-files-found: warn
