name: CI

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

concurrency:
  # Skip intermediate builds: all builds except for builds on the `main` branch
  # Cancel intermediate builds: only pull request builds
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/main' || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  finalize:
    timeout-minutes: 10
    needs: [test, format]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo test: ${{ needs.test.result }}
          echo format: ${{ needs.format.result }}
      - run: exit 1
        if: |
          (needs.test.result != 'success') ||
          (needs.format.result != 'success')

  test:
    permissions:
      actions: write
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 2
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.6"
          - "lts"
          - "1"
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        # macOS min seems to consistently stall on `Plots` notebooks. Skip this
        # combination and test on a slightly newer macOS version instead.
        # min windows has recently stalled out on mimetypes, use lts windows in
        # the tests. We still test min on Linux.
        exclude:
          - version: "1.6"
            os: macos-latest
          - version: "1.6"
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: julia-actions/install-juliaup@1cc1b0ecfb06c04ff09fe24cab1476106460750e # v3.1.5
        with:
          channel: "${{ matrix.version }}"

      # These versions of `julia` are used for the cross-version notebook tests.
      - run: juliaup add 1.9.4
      - run: juliaup add 1.10.7
      - run: juliaup add 1.11.2

      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true
          r-version: "4.3.3"
      - run: echo "LD_LIBRARY_PATH=$(R RHOME)/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        if: matrix.os == 'ubuntu-latest'
      - run: julia -e 'cp("/usr/lib/x86_64-linux-gnu/libstdc++.so.6", joinpath(dirname(Sys.BINDIR), "lib", "julia", "libstdc++.so.6"); force = true)'
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.6'

      # Worker tests
      # Plots.jl's GR backend uses Julia 1.10+ syntax. Remove it on older
      # Julia to avoid compile errors; the test is filtered out via tags.
      - run: julia --project=src/QuartoNotebookWorker/test -e 'using Pkg; Pkg.rm("Plots"; io=devnull)'
        if: matrix.version == '1.6'

      # RCall + Julia 1.12 hangs on Windows during temp file cleanup.
      # RCall itself only tests lts on Windows. Remove it; tests filtered via tags.
      # See: https://github.com/JuliaInterop/RCall.jl/pull/589
      - run: julia --project=src/QuartoNotebookWorker/test -e 'using Pkg; Pkg.rm("RCall"; io=devnull)'
        if: matrix.os == 'windows-latest' && matrix.version == '1'

      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
        with:
          project: src/QuartoNotebookWorker

      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
        with:
          project: src/QuartoNotebookWorker
          depwarn: "yes"

      # Runner tests
      # TODO: use quarto_jll for integration tests once modern enough versions are available
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: 1.7.17

      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
        with:
          depwarn: "yes"
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        with:
          verbose: true
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1"
      - run: |
          julia --project=.ci -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
          julia --project=.ci .ci/format.jl
